# Popup session config — sourced by ~/.dotfiles/tmux/popup.sh every time the popup opens.
#
# 重要：这里 **不能** 用 `set -g` / 全局 `bind` 去覆盖主配置。
# 旧版本把 h/n/p/k/q、status、window-status-format 都设成了全局，结果只要打开过一次 popup，
# 主 session 里 prefix+h 就变成开 htop、prefix+n/p 不再切窗口、状态栏格式也被改掉。
# 现在：选项只作用于 popup 这个 session；按键用 if -F 判断当前 session，
# 在 popup 里执行 popup 的动作，其它 session 里保持主配置原来的行为。

# 状态栏只在 popup session 里隐藏
set-option -t popup status off

# Ctrl+f, q: 关闭 popup（其它 session 里保持默认的 display-panes）
bind q if -F '#{==:#{session_name},popup}' 'detach-client' 'display-panes'

# Ctrl+f, h: htop（其它 session 里：向左切 pane）
bind -r h if -F '#{==:#{session_name},popup}' "new-window -n htop htop" 'select-pane -L'

# Ctrl+f, k: kubectl top nodes（其它 session 里：向上切 pane）
bind -r k if -F '#{==:#{session_name},popup}' "new-window -n kubectl 'kubectl top nodes; read -n1 -s -r -p \"[press any key]\"'" 'select-pane -U'

# Ctrl+f, n: nmap（其它 session 里：下一个窗口）
bind n if -F '#{==:#{session_name},popup}' "new-window -n nmap 'nmap -v localhost; read -n1 -s -r -p \"[press any key]\"'" 'next-window'

# Ctrl+f, p: glances（其它 session 里：上一个窗口）
bind p if -F '#{==:#{session_name},popup}' "new-window -n glances glances" 'previous-window'

# 根据您的需求，可以添加更多自定义快捷键和命令，记得同样用 if -F 包一层，例如：
# bind t if -F '#{==:#{session_name},popup}' "new-window -n tig tig" 'clock-mode'
