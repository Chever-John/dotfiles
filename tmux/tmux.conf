set -g default-shell /bin/zsh
set -g default-command "exec /bin/zsh -l"

# remap prefix from 'C-b' to 'C-f'
unbind C-b
set -g prefix 'C-f'
bind 'C-f' send-prefix

# 保留系统默认的 PATH，并加入 dotfiles 自带的 tmux-* 辅助命令（popup/run-shell 里要用）
# 用 if-shell 判断，避免每次 prefix+r 重载都在 PATH 前面重复叠加一遍
if-shell 'case ":$PATH:" in *":$HOME/.dotfiles/tmux/bin:"*) exit 1;; esac' {
  set-environment -g PATH "$HOME/.dotfiles/tmux/bin:$HOME/.fzf/bin:$HOME/.local/bin:$PATH"
}

# disable the repeat key delay
set -g repeat-time 0

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
setw -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# word separators for automatic word selection
setw -g word-separators ' @"=()[]_-:,.'
setw -ag word-separators "'"

# show times longger than supposed
set -g display-panes-time 2000

# tmux message are displayed for 4 seconds
set -g display-time 4000

# auto window rename
set -g automatic-rename on

# activity alerts: 刻意关闭。窗口里常驻 opencode/codex 等持续输出的 agent，
# 开启后所有后台窗口的 activity 图标常亮，纯噪音。
set-window-option -g monitor-activity off
set -g visual-activity off

# increase scrollback lines
set -g history-limit 10000

# enable clipboard
set -g set-clipboard on

# mouse behavior
set -g mouse on

# disable escape delay
set -sg escape-time 0

### LOOK && FEEL ###

# truecolor support
set -sa terminal-features ',xterm-256color:RGB'

# default terminal is 256 colors
set -g default-terminal 'tmux-256color'

# default statusbar colors
set -g status-bg default
set -g status-fg colour179

# aggressive resize
set-window-option -g aggressive-resize off

# iTerm2 window name
set -g set-titles on

# moving between panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize panes with vim movement keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# remove confirmation questions when closing windows/panes
bind x kill-pane
bind X kill-pane -a
bind & kill-window

# go to last window
bind ^ last-window

# window 编号从 1 开始，0 空闲，用来跳转 window 10（配合 alacritty 的 Cmd+0）
bind 0 select-window -t :10

# splitting panes with current path
bind c new-window -c '#{pane_current_path}'
# bind vv split-window -h -c '#{pane_current_path}'
# bind ss split-window -v -c '#{pane_current_path}'
bind v split-window -h -l 100 -c "#{?pane_path,#{s@^file.//@@:pane_path},#{pane_current_path}}"
bind s split-window -v -l 30 -c "#{?pane_path,#{s@^file.//@@:pane_path},#{pane_current_path}}"

# Pressing ctrl+Shift+Left (will move the current window to the left. Similarly 
# right. No need to use the modifier (C-b))
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# Source file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!!!"

# move panes to another window
bind M-1 join-pane -t :1 \; display-message "Merged to window 1"
bind M-2 join-pane -t :2 \; display-message "Merged to window 2"
bind M-3 join-pane -t :3 \; display-message "Merged to window 3"
bind M-4 join-pane -t :4 \; display-message "Merged to window 4"
bind M-5 join-pane -t :5 \; display-message "Merged to window 5"
bind M-6 join-pane -t :6
bind M-7 join-pane -t :7
bind M-8 join-pane -t :8
bind M-9 join-pane -t :9

# Use vim keybindings in copy mode
setw -g mode-keys vi

# 将 / 按键邦定为进入复制模式，并同时发送 ？ 键用于向上搜索。
bind / copy-mode \; send-key ?

# Update default binding of `Enter` and `Space to also use copy-pipe
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi Space

bind -T edit-mode-vi Up send-keys -X history-up
bind -T edit-mode-vi Down send-keys -X history-down

# begin selection as in Vim
bind -T copy-mode-vi v send-keys -X begin-selection

# 用于在 tmux 的 copy-mode-vi 模式下启用矩形选择功能，类似于 vim 中的可视块模式。
bind -T copy-mode-vi C-v send -X rectangle-toggle

# copy text in copy mode
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 允许鼠标选择并复制文本。
# 注意用 -no-clear 而不是 -and-cancel：后者在松开左键时会退出 copy-mode，
# 视口立刻跳回历史最底部，翻着历史想复制一行就被弹回去，非常难用。
# -no-clear 复制完仍停留在 copy-mode（保留高亮），按 q / Esc 才回到底部。
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear

# 双击选词 / 三击选行，tmux 内置默认同样是 copy-pipe-and-cancel，一样会弹回底部。
# root 表那两条不用动：它们只在「不在 copy-mode」时触发，本来就在底部，cancel 无害。
# 要改的是已经处于 copy-mode 时的这两条。
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection-no-clear
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-no-clear
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection-no-clear

# translator
bind -T copy-mode t send-keys -X copy-pipe-and-cancel "tmux-vocab"
bind -T copy-mode-vi t send-keys -X copy-pipe-and-cancel "tmux-vocab"

# run command in split pane / another window
bind | display-popup -b rounded -d "#{pane_current_path}" -E 'tmux-commands | xargs -r tmux split-window -h -c "#{pane_current_path}"'
bind - display-popup -b rounded -d "#{pane_current_path}" -E 'tmux-commands | xargs -r tmux split-window -v -c "#{pane_current_path}"'
bind C display-popup -b rounded -d "#{pane_current_path}" -E 'tmux-commands | xargs -r tmux new-window -c "#{pane_current_path}"'

# tmux menu
bind A display-menu -x R -y P -T '#[align=centre fg=orange] Commands ' \
  'Synchronize Panes' 's' 'set-window-option synchronize-panes' \
  'Rename Tab' ',' 'command-prompt -I "#W" { rename-window "%%" }' \
  'Run Tmux Command' ':' 'command-prompt'

# project commands
bind E display-popup -b rounded -d "#{pane_current_path}" -E 'tmux-project commands | xargs -r tmux-run -t right run --'

# project menu
# bind R run-shell 'tmux-project -d "#{pane_current_path}" menu'

# grep lines
bind G display-popup -b rounded -h 90% -w 85% -x C -y C -d "#{pane_current_path}" -E "tmux-grep | xargs -r tmux-helix open"

# switch pane
bind P display-popup -b rounded -T '#[fg=orange]❀ Panes' -E 'tmux-panes'

# switch session
bind S display-popup -b rounded -T '#[fg=orange]❀ Sessions' -E 'tmux-sessions'

# popup session
# I create this popup session just for quick checking my htop/glances status.
# Now it support(in macOS):
# 1. Command+c to create htop windows in popup session;
# 2. Command+p to create glances windows in popup session;
# 3. Command+n to create nmap(`nmap -v localhost` command to show status);
# 必须 -b：同步 run-shell 会阻塞当前 client 的命令队列，而 popup.sh 里的 display-popup
# 又要在这个 client 上弹窗，结果 popup 根本出不来（session 建了但没 attach）。
bind o run-shell -b "bash ~/.dotfiles/tmux/popup.sh"

# status bar
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-style none,fg=#a89984,bg=#3c3836

# status variables format
if-shell 'test "$(uname)" = "Darwin"' {
  set -g @OS ""
  set -g @IM "  #(defaults read ~/Library/Preferences/com.apple.HIToolbox.plist AppleCurrentKeyboardLayoutInputSourceID | awk -F. '{print $4}' | sed s/PinyinKeyboard/中/)"
  set -g @CPU " #(iostat -c 2 disk0 | sed '/^\s*$/d' | tail -n 1 | awk '{usage=100-$6} END {print(usage)}' | sed 's/,/./')"
} {
  set -g @OS ""
  set -g @IM " #(whoami)#{?SSH_CLIENT,@#h,}"
  set -g @CPU " #(vmstat 1 2 | tail -1 | awk '{usage=100-$15} END {print(usage)}' | sed 's/,/./')"
}
set -g @GIT_BRANCH " #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD || echo ' ')"

# status bar left
set -g status-left-length 100
set -g status-left-style none
set -g status-left '#[fg=#282828,bg=#a89984,nobold] #{E:@OS} #S  #[fg=#a89984,bg=#3c3836,nobold]'

# status bar right
set -g status-right-length 150
set -g status-right-style none
set -g status-right '#[fg=#504945,bg=#3c3836]#[fg=#a89984,bg=#504945] #{E:@CPU}%% #[fg=#3c3836]#[fg=#a89984,bg=#504945]  %a %b %d #[fg=#3c3836] #[fg=#a89984,bg=#504945] %H:%M %p #[fg=#3c3836,bg=#504945]#[fg=#a89984,bg=#3c3836]#[fg=#282828,bg=#a89984] #{E:@GIT_BRANCH} #[fg=#3c3836] #[fg=#282828,bg=#a89984]#{E:@IM} '

# window bar style
set -g window-status-style 'fg=#3c3836,bg=#504945'
set -g window-status-current-style 'fg=#ebdbb2,bg=#49556a'

set -g window-status-format '#[fg=#3c3836,nobold]#[fg=#a89984] #I: #W #{?window_last_flag, ,}#[fg=#504945,bg=#3c3836,nobold]'
set -g window-status-current-format '#[fg=#3c3836,nobold]#[fg=#ebdbb2] #I: #W #[fg=#689d6a]#{?window_zoomed_flag,,} #[fg=#49556a,bg=#3c3836,nobold]'
set -g window-status-separator ''

# pane border style
set -g pane-active-border-style fg='#fe8019'
set -g pane-border-style fg='#3c3836'

# pane title: 边框顶部显示 pane 名字；未手动命名时显示当前运行的程序
set -g pane-border-format ' #[bold]#{?pane_active,#[fg=#fe8019],#[fg=#a89984]}#{pane_index}: #{?#{==:#{pane_title},#h},#{pane_current_command},#{pane_title}} '
# 只有窗口内有多个 pane 时才显示边框标题（split/kill 都会触发 layout-changed）
# 注意：pane-border-status 是枚举选项，set 不展开 format，必须用 if -F 分支
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'
# prefix + T 手动给当前 pane 命名；禁止 pane 内程序覆盖手工标题
bind T command-prompt -p 'pane name:' 'set-option -p allow-set-title off ; select-pane -T "%%%"'
# prefix + U 使用系统剪贴板命名；多行和连续空白折叠为单个空格
# 跨平台：macOS 用 pbpaste，Linux 桌面用 wl-paste/xclip，无图形界面的服务器退回最近一次 tmux 复制的内容
bind U run-shell 'title="$(tmux-clipboard-paste | tr "\r\n\t" "   " | sed -E "s/[[:space:]]+/ /g; s/^ //; s/ $//")"; [ -n "$title" ] || exit 0; tmux set-option -p -t "#{pane_id}" allow-set-title off; tmux select-pane -t "#{pane_id}" -T "$title"'

# message style
set -g message-style none,fg='#fe8010',bg='#504945'
set -g message-command-style none,fg='#fe8010',bg='#504945'

# mode style
set -g mode-style 'bg=brightblack,fg=white,noreverse'

set -g focus-events on

# List of plugins
# see this https://github.com/tmux-plugins/tpm to installation
set -g @plugin 'tmux-plugins/tpm'
# tpm 默认把 prefix+U 绑定为"更新插件"，并且在本文件最后加载，会覆盖上面
# "prefix+U 用剪贴板命名 pane"。把更新插件挪到 prefix+Alt+Shift+U。
set -g @tpm-update 'M-U'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-yank on a headless Linux box has no xclip/pbcopy: push the selection to the
# *local* terminal clipboard via OSC 52 instead (needs set-clipboard on, see above).
if-shell '! command -v pbcopy >/dev/null && [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ]' {
  set -g @override_copy_command 'tmux load-buffer -w -'
}

# ---------------------------------------------------------------------------
# session 持久化：resurrect（存/取快照） + continuum（定时自动存 + 启动自动恢复）
#
# 为什么要这个：2026-10-01 一条没带 -L 的 `tmux kill-server` 打在了默认 socket 上，
# 直接干掉了开机起就在跑的 server。所有 window 的 tmux client 随之退出，alacritty
# 的 shell 是 `exec` 成 client 的，于是全部窗口关闭、alacritty 自己也跟着退出。
# 当时没有任何持久化，现场零恢复可能。装上这两个插件后，最坏情况损失 <= 15 分钟。
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 手动存/取：prefix + Ctrl-s 存，prefix + Ctrl-r 取（resurrect 默认键）
set -g @resurrect-capture-pane-contents 'on'   # 连 pane 里的滚动内容一起存
set -g @resurrect-strategy-nvim 'session'      # nvim 用自带 session 文件恢复

set -g @continuum-save-interval '15'           # 每 15 分钟自动存盘
set -g @continuum-restore 'on'                 # tmux server 启动时自动恢复上次快照

# ssh pane 的处理：记录，但不自动重连。
#
# 故意不把 ssh 写进 @resurrect-processes。远程活儿全在
# `ssh -t mmd tmux new-session ... -s X` 里，而 server 一启动就自动并发拉起一批 ssh
# 是不稳的：会在跳板机上造成认证风暴；笔记本刚唤醒还没网时每个 pane 都卡住；而且记录
# 下来的命令带 -D，自动跑会把你别处的客户端踢下线——正是 alacritty/tmux-launch.sh
# 里已经除掉的那个坑。
#
# 改成：每次 resurrect 存盘时，把「当时真正开着的」ssh 目标记进注册表；要恢复时手动跑
# `tmux-ssh-restore`，它只恢复注册表里的那些，带可达性预检、逐个连接、跳过已开着的，
# 并且用 -A 不带 -D。两个脚本都在 ~/.dotfiles/tmux/bin/（已在 tmux 的 PATH 里）。
set -g @resurrect-hook-post-save-all 'PATH="/opt/homebrew/bin:$PATH" ~/.dotfiles/tmux/bin/tmux-ssh-record'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Homebrew's tpm on macOS, git-cloned tpm (~/.tmux/plugins/tpm) everywhere else.
#
# 没有 tpm 的机器（比如这台 mac）走手动 run-shell 兜底：tpm 只是个 clone 工具，
# 插件本身用 run-shell 直接加载即可。注意顺序——continuum 必须在 resurrect 之后。
# 这里特意不让两条路同时生效，否则 continuum 的定时 hook 会被注册两遍。
if-shell 'test -x /opt/homebrew/opt/tpm/share/tpm/tpm' {
  run '/opt/homebrew/opt/tpm/share/tpm/tpm'
} {
  if-shell 'test -x ~/.tmux/plugins/tpm/tpm' {
    run '~/.tmux/plugins/tpm/tpm'
  } {
    # 注意必须补 PATH：这台 mac 上 tmux server 继承到的 PATH 不含 /opt/homebrew/bin，
    # 而插件脚本内部是按名字调 `tmux` 的，不补就直接 127（command not found）。
    # Linux 上 /opt/homebrew 不存在，多前置一个无效目录无害。
    if-shell 'test -x ~/.tmux/plugins/tmux-resurrect/resurrect.tmux' {
      run-shell 'PATH="/opt/homebrew/bin:$PATH" ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
    }
    if-shell 'test -x ~/.tmux/plugins/tmux-continuum/continuum.tmux' {
      run-shell 'PATH="/opt/homebrew/bin:$PATH" ~/.tmux/plugins/tmux-continuum/continuum.tmux'
    }
  }
}
