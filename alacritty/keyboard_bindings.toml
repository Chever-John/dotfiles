# cmd + 0 不做绑定：保留 alacritty 默认的 ResetFontSize（配合 cmd+= / cmd+-）。
# 跳转 window 10 用 prefix+0（tmux.conf 中 bind 0 select-window -t :10）。

# cmd + S 打开全局切换器（tmux 内置 choose-tree）：树状列出所有 session/window/pane，
# j/k 移动回车跳转。注：tmux.conf 的 prefix+S 依赖的 tmux-sessions 脚本本机不存在，
# choose-tree 是当前唯一可用的切换器。
[[keyboard.bindings]]
chars = "\u0006w"
key = "S"
mods = "Command"

# 使用 cmd + [ 和 cmd + ] 切换到上一个/下一个窗口
# use cmd + [ or cmd + ] to check previous/next windows
[[keyboard.bindings]]
chars = "\u0006p"
key = "LBracket"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0006n"
key = "RBracket" 
mods = "Command"

# Comment.Nvim plugin
[[keyboard.bindings]]
key = "Slash"
mods = "Control"
chars = "\u001f"

